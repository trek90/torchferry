[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torchferry"
version = "0.1.0"
description = "An asyncio dynamic batching engine for PyTorch inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["torchferry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
